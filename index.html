.pcback{background:repeating-linear-gradient(45deg,#24466E 0 4px,#18314F 4px 8px);box-shadow:0 0 0 4px #F6EFE2 inset,0 0 0 1px rgba(3,6,12,.55),0 8px 18px -8px rgba(0,0,0,.85);flex-shrink:0}
.shoe{position:absolute;top:10px;right:14px;width:86px;height:122px;pointer-events:none}
.shoe .pcback{position:absolute;inset:0;border-radius:9px}
.felt{border-radius:16px;background:radial-gradient(120% 90% at 50% 0%,#111B2E 0%,#0B111D 60%,#070C14 100%);box-shadow:inset 0 1px 0 rgba(217,181,106,.12),inset 0 22px 40px -24px rgba(0,0,0,.95)}
@keyframes deal{0%{transform:translate(var(--dx),var(--dy)) rotate(var(--r0)) rotateY(70deg) scale(.9);opacity:0;filter:brightness(.7)}20%{opacity:1}100%{transform:translate(0,0) rotate(var(--r1)) rotateY(0) scale(1);opacity:1;filter:brightness(1)}}
.dealt{animation:deal .5s cubic-bezier(.22,.9,.3,1) both;animation-delay:var(--d);transform-style:preserve-3d;backface-visibility:hidden;will-change:transform,opacity}
.tbl{perspective:900px}
@keyframes shoe{0%,100%{transform:translateX(0)}30%{transform:translateX(-6px)}}
.shoe.go{animation:shoe .5s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rise{animation:rise .26s var(--ease) both}
.opt{transition:transform .13s var(--ease),filter .13s,background .22s,color .22s,opacity .22s}
.opt:active{transform:scale(.97)}
@keyframes leave{from{opacity:1}to{opacity:0}}
.leave .dealt{animation:leave .18s ease-in-out forwards !important;animation-delay:0ms !important}
.btn:disabled{opacity:.35;filter:none;cursor:default;transform:none}
@media(hover:hover){.opt:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.15)}}
.opt:active:not(:disabled){transform:scale(.97)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .3s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(217,181,106,.7)}100%{box-shadow:0 0 0 14px rgba(217,181,106,0)}}
.glow{animation:glow .6s ease-out}
.drain{position:absolute;left:0;top:0;height:4px;border-radius:0 2px 2px 0;width:100%;transform-origin:left;animation:drain var(--t) linear forwards;opacity:.9}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.shimmer{position:relative;overflow:hidden}.shimmer::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shimmer 2.4s ease-in-out infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
::selection{background:rgba(217,181,106,.35)}
.opt{min-height:44px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.opt:focus-visible,.chipseg button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.bj ::-webkit-scrollbar{display:none}
.bj input::placeholder,.bj textarea::placeholder{color:rgba(156,143,147,.7)}
button,input{-webkit-tap-highlight-color:transparent}
button{user-select:none;-webkit-user-select:none}
.hidescroll::-webkit-scrollbar{display:none}
input[type=range]{-webkit-appearance:none;appearance:none;height:26px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,rgba(217,181,106,.55),rgba(217,181,106,.2))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F0D9A2,var(--brass) 70%);border:1px solid rgba(0,0,0,.45);box-shadow:0 2px 6px rgba(0,0,0,.6);margin-top:-9px}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(217,181,106,.35)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--brass);border:1px solid rgba(0,0,0,.45)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.25)}100%{transform:scale(1)}}
.pop{display:inline-block;animation:pop .35s ease}
.burst{position:absolute;inset:0;pointer-events:none;overflow:visible}
.burst i{position:absolute;left:50%;top:45%;width:5px;height:5px;border-radius:50%;background:var(--brass);opacity:0;animation:fly var(--t) ease-out forwards;animation-delay:var(--dl)}
.burst i:nth-child(3n){background:#F0D9A2}.burst i:nth-child(4n){width:3px;height:3px}
@keyframes fly{0%{opacity:1;transform:rotate(var(--a)) translateY(-6px) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(calc(-6px - var(--d))) scale(.3)}}
@media (prefers-reduced-motion:reduce){.bar,.btn,.dealt,.rise,.opt,.shake,.shoe.go,.shimmer::after,.chipbtn,.pop,.burst i{transition:none;animation:none;transform:none}}
